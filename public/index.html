<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Private Runway Workflow</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f17;
      color: #e6e6e6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #1f2a3a;
      font-weight: 600;
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
    }
    aside {
      border-right: 1px solid #1f2a3a;
      padding: 16px;
    }
    section {
      padding: 16px;
    }
    textarea {
      width: 100%;
      min-height: 140px;
      background: #0f1624;
      color: #e6e6e6;
      border: 1px solid #2a3a52;
      border-radius: 10px;
      padding: 10px;
      resize: vertical;
    }
    button {
      margin-top: 12px;
      width: 100%;
      background: #2a66ff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover {
      background: #3b74ff;
    }
    .node {
      background: #0f1624;
      border: 1px solid #1f2a3a;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .node h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #9fb3cc;
    }
    .node pre {
      margin: 0;
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<header>
  Private Runway-like Workflow
</header>

<main>
  <aside>
    <h3>Input</h3>
    <textarea id="prompt" placeholder="Describe your scene…"></textarea>
    <button onclick="runWorkflow()">Run Workflow</button>
  </aside>

  <section>
    <div class="node">
      <h3>Node 1 — Scene Intent</h3>
      <pre id="node1">Waiting…</pre>
    </div>
    <div class="node">
      <h3>Node 2 — Cinematic Expansion</h3>
      <pre id="node2">Waiting…</pre>
    </div>
    <div class="node">
      <h3>Node 3 — Final Shot</h3>
      <pre id="node3">Waiting…</pre>
    </div>
  </section>
</main>

<script>
function runWorkflow() {
  const input = document.getElementById("prompt").value || "A solitary figure in tall grass.";
  document.getElementById("node1").textContent =
    "Interpreting scene intent from input:\n" + input;

  document.getElementById("node2").textContent =
    "Expanding scene with cinematic tone, lighting, and atmosphere…";

  document.getElementById("node3").textContent =
    "Final shot: wide cinematic framing, golden hour backlight, quiet and sacred mood.";
}
</script>

</body>
</html>
